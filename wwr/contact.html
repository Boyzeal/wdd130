
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description" content="Contact White Water Rafting for reservations, inquiries, and adventure planning.">
    <meta name="author" content="Simon Atoyebi">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-logo.jpg" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <!-- Company Info -->
        <section class="contact-info">
            <h1>Contact Us</h1>
            <p><strong>Address:</strong> Ijede Rd, Ikorodu, 104102, Lagos</p>
            <p><strong>Phone:</strong> +234 915 188 4528</p>
            <p><strong>Email:</strong> atoyebisegunsimon@gmail.com</p>

            <!-- Google Map -->
            <<iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d126821.38671091704!2d3.405292743359369!3d6.626002500000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103bef8f97d28c9b%3A0x2ce7c70f8ca3dbf6!2sThe%20Church%20of%20Jesus%20Christ%20of%20Latter-day%20Saints!5e0!3m2!1sen!2sng!4v1775858600128!5m2!1sen!2sng" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                
            </iframe>
        </section>

        <!-- Employee Profiles -->
        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Guide">
                <figcaption>Simon Atoyebi - Lead Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Instructor">
                <figcaption>Jane Smith - Safety Instructor</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Manager">
                <figcaption>Mike Johnson - Operations Manager</figcaption>
            </figure>
        </section>

        <!-- Contact Form -->
        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <!-- Name -->
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>

                <!-- Email -->
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required>

                <!-- Radio Buttons -->
                <p>Purpose of Message:</p>

                <label>
                    <input type="radio" name="purpose" value="general" required>
                    General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" value="suggestion">
                    Website Suggestion
                </label>

                <!-- Message -->
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <!-- Checkbox -->
                <label>
                    <input type="checkbox" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <!-- Submit -->
                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>(c)2026 White Water Rafting | Simon Atoyebi</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/pinterest-logo.png" alt="Pinterest"></a>
            <a href="#"><img src="images/facebook-logo.png" alt="Facebook"></a>
            <a href="#"><img src="images/instagram-logo.png" alt="Instagram"></a>
        </nav>
    </footer>

</body>
</html>
